aid: seaport-therapeutics
name: Seaport Therapeutics
description: 'Seaport Therapeutics is a Boston-based clinical-stage biopharmaceutical company developing
  new medicines for patients with depression, anxiety and other neuropsychiatric disorders. Its proprietary
  Glyph platform — licensed from the Porter Research Group at Monash University — applies lymphatic-targeting
  oral prodrug chemistry so that more medicine reaches the bloodstream and brain while bypassing first-pass
  liver metabolism and reducing side effects. The clinical pipeline includes GlyphAllo (SPT-300), an oral
  allopregnanolone prodrug in Phase 2 for major depressive disorder; GlyphAgo (SPT-320), an oral agomelatine
  prodrug in Phase 2 for generalized anxiety disorder; and Glyph2BLSD (SPT-348), a pre-clinical
  non-hallucinogenic 2-bromo-LSD neuroplastogen. Seaport publishes no public API, developer portal, SDK
  or machine-readable specification; its public web surface is a corporate WordPress site plus a hosted
  investor-relations subdomain.'
